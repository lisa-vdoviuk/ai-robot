server:
  host: "0.0.0.0"
  port: 5443
  https: true
  certfile: null
  keyfile: null
  secret_key: "change-me-local-dev"

assistant:
  name: "Orion"
  language: "en"
  max_history_turns: 3
  visible_rationale: false
  system_prompt: |
    You are Orion, a local voice-first AI companion running on a Raspberry Pi 5 robot.
    Speak English only.
    Keep answers short and natural: usually 1 sentence, maximum 2 sentences.
    Use simple wording and clear punctuation.
    The speech transcript may contain recognition mistakes; ask one short clarification if it is unclear.
    Camera observations and robot tool results are imperfect sensor/tool context, not facts you invented.
    Never claim to see details that are not present in the camera observation.

stt:
  engine: "vosk"
  sample_rate: 16000
  model_path: "models/vosk/vosk-model-en-us-0.22-lgraph"
  min_final_chars: 2
  min_final_words: 1
  reject_phrases: ["um", "uh", "hmm", "mm", "noise"]

llm:
  engine: "groq"
  groq:
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    model: "llama-3.1-8b-instant"
    timeout_s: 30
  temperature: 0.20
  top_p: 0.85
  max_tokens: 80

# Offline TTS profile for Raspberry Pi 5.
# Uses Kokoro int8 ONNX for good quality with acceptable CPU load.
tts:
  engine: "kokoro"
  normalize_text: true
  stream_during_generation: true
  sentence_min_chars: 18
  sentence_max_chars: 150
  chunk_max_chars: 190
  coalesce_wait_s: 0.02
  synth_timeout_s: 25
  join_timeout_s: 32
  playback_gap_ms: 80

  kokoro:
    voice: "af_heart"
    speed: 1.05
    lang: "en-us"
    sample_rate: 24000
    warmup: true
    warmup_text: "Ready."
    threads: 2
    max_chars: 420
    model_path: "models/kokoro/kokoro-v1.0.int8.onnx"
    voices_path: "models/kokoro/voices-v1.0.bin"

  pronunciation:
    YOLO: "you only look once"
    ONNX: "onix"
    GPIO: "G P I O"
    HC-SR04: "H C S R zero four"
    ESP32: "E S P thirty two"
    Raspberry Pi: "Raspberry Pie"
    Pi 5: "Pie Five"
    Vosk: "vosk"
    Kokoro: "ko ko ro"
    Groq: "grock"

memory:
  enabled: true
  db_path: "logs/memory.sqlite"
  user_id: "default"
  attach_to_prompt: true
  max_facts: 5
  recall_k: 2
  extract_facts: true
  max_episodes: 2000
  embeddings:
    enabled: false
    model_path: "models/embed/nomic-embed-text-v1.5.Q4_K_M.gguf"
    n_ctx: 512
    n_threads: 3
  summary:
    enabled: true
    trigger_turns: 10
    keep_recent_turns: 4
    max_tokens: 120

camera:
  enabled: true
  width: 640
  height: 480
  cv2_device_index: 0

vision:
  enabled: true
  poll_enabled: false
  poll_interval_s: 8.0
  snapshot_on_turn: true
  always_attach_to_prompt: false
  max_prompt_age_s: 8.0
  log_poll_observations: false
  obstacle_area_ratio: 0.10

  motion:
    enabled: true
    threshold: 24
    min_area_ratio: 0.01

  object_detection:
    enabled: true
    backend: "yolo"
    model_path: "models/vision/yolo11n.onnx"
    imgsz: 640
    confidence_threshold: 0.20
    nms_threshold: 0.45
    max_objects: 10
    threads: 2
    debug: false

client:
  vad_threshold: 0.018
  barge_in_threshold: 0.045
  vad_hold_ms: 650
  min_speech_ms: 180
  preroll_ms: 450
  audio_chunk_ms: 80

robot:
  enabled: false
  base_url: "http://192.168.1.50"
  token: "change-me-robot-token"
  timeout_s: 2.0
  min_confidence: 0.55
  min_speed: 0.20
  max_speed: 0.75
  default_speed: 0.45
  min_duration_ms: 150
  max_duration_ms: 1800
  default_duration_ms: 700
  planner_max_tokens: 80
  fast_intent_gate: true
  stop_on_barge_in: true
  stop_on_disconnect: true

quality_guard:
  enabled: true
  ask_clarification_for_single_word: true

system:
  enabled: true
  interval_s: 2.0
  temp_warn_c: 70.0
  temp_critical_c: 80.0
  cpu_warn_pct: 80.0
  cpu_critical_pct: 92.0
  ram_warn_pct: 80.0
  ram_critical_pct: 92.0
