server:
  host: "0.0.0.0"
  # Browser microphone access from another device usually requires HTTPS.
  # Use https://<raspberry-pi-ip>:5443 and accept the self-signed certificate.
  port: 5443
  https: true
  certfile: null
  keyfile: null
  secret_key: "change-me-local-dev"

assistant:
  name: "Orion"
  language: "en"
  max_history_turns: 3
  visible_rationale: false
  system_prompt: |
    You are Orion, a local voice-first AI companion running on a Raspberry Pi.
    Speak English only.

    Keep answers short and natural: usually 1 sentence, maximum 2 sentences.
    Use simple wording and clear punctuation.
    The user transcript comes from speech recognition and may contain errors.
    If the transcript is unclear, ask one short clarification.

    The robot may provide camera observations, robot tool results, and logs.
    Treat them as sensor/tool context.

stt:
  engine: "vosk"
  sample_rate: 16000
  # Quality default: better English model than the tiny 40 MB one, still feasible on Raspberry Pi 5.
  # For maximum speed, switch to models/vosk/vosk-model-small-en-us-0.15 and run download_models.py --stt small.
  model_path: "models/vosk/vosk-model-en-us-0.22-lgraph"
  min_final_chars: 2
  min_final_words: 1
  reject_phrases:
    - "um"
    - "uh"
    - "hmm"
    - "mm"
    - "noise"

llm:
  engine: "groq"

  groq:
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    model: "llama-3.1-8b-instant"
    timeout_s: 30

  temperature: 0.25
  top_p: 0.85
  max_tokens: 70

tts:
  engine: "kokoro"

  normalize_text: true
  stream_during_generation: false

  sentence_min_chars: 60
  sentence_max_chars: 260
  chunk_max_chars: 320
  coalesce_wait_s: 0.05

  synth_timeout_s: 35
  join_timeout_s: 45
  playback_gap_ms: 120

  kokoro:
    lang_code: "a"
    voice: "af_heart"
    sample_rate: 24000

  # fallback, якщо повернешся до piper
  piper_bin: "piper"
  model_path: "models/piper/en_US-lessac-medium.onnx"
  config_path: "models/piper/en_US-lessac-medium.onnx.json"
  speaker_id: null
  length_scale: 1.12
  noise_scale: 0.45
  noise_w: 0.55
  sentence_silence: 0.28

memory:
  enabled: true
  db_path: "logs/memory.sqlite"
  user_id: "default"
  attach_to_prompt: true

  max_facts: 5
  recall_k: 2

  extract_facts: true
  max_episodes: 2000

  embeddings:
    enabled: false
    model_path: "models/embed/nomic-embed-text-v1.5.Q4_K_M.gguf"
    n_ctx: 512
    n_threads: 3

  summary:
    enabled: true
    trigger_turns: 10
    keep_recent_turns: 4
    max_tokens: 120

camera:
  enabled: true
  width: 320
  height: 240

vision:
  enabled: true
  poll_enabled: false
  poll_interval_s: 8.0

  snapshot_on_turn: true
  always_attach_to_prompt: false
  max_prompt_age_s: 8.0

  log_poll_observations: false
  obstacle_area_ratio: 0.10

  motion:
    enabled: true
    threshold: 24
    min_area_ratio: 0.01

  object_detection:
    enabled: true
    backend: "opencv_yolo_onnx"

    model_path: "models/vision/yolo11n.onnx"
    labels_path: "models/vision/coco.names"

    imgsz: 416
    confidence_threshold: 0.35
    nms_threshold: 0.45
    max_objects: 8

client:
  vad_threshold: 0.018
  # Higher threshold while the assistant is speaking to avoid cancelling itself from speaker echo.
  barge_in_threshold: 0.045
  vad_hold_ms: 650
  min_speech_ms: 180
  preroll_ms: 450
  audio_chunk_ms: 80

robot:
  # Set true when the ESP32 firmware in esp32/voicepi_motor_controller.ino is running.
  enabled: false
  # Use the IP printed in the ESP32 Serial Monitor after it connects to Wi-Fi.
  base_url: "http://192.168.1.50"
  token: "change-me-robot-token"
  timeout_s: 2.0

  # Safety clamps. The LLM may request a movement, but these hard limits win.
  min_confidence: 0.55
  min_speed: 0.20
  max_speed: 0.75
  default_speed: 0.45
  min_duration_ms: 150
  max_duration_ms: 1800
  default_duration_ms: 700
  planner_max_tokens: 80
  # Speeds up normal chat: only run the LLM robot planner when the transcript looks robot-control-related.
  # This gate never executes commands by itself; it only decides whether to ask the planner.
  fast_intent_gate: true

  # Emergency behavior.
  stop_on_barge_in: true
  stop_on_disconnect: true

system:
  # Raspberry Pi health telemetry shown on the dashboard (CPU temp, CPU load, RAM).
  enabled: true
  # How often the background sampler refreshes (seconds). The dashboard polls /system/stats.
  interval_s: 2.0
  # Thresholds for highlighting. The Pi 5 starts soft-throttling around 80-85 C.
  temp_warn_c: 70.0
  temp_critical_c: 80.0
  cpu_warn_pct: 80.0
  cpu_critical_pct: 92.0
  ram_warn_pct: 80.0
  ram_critical_pct: 92.0