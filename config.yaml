server:
  host: "0.0.0.0"
  # Browser microphone access from another device usually requires HTTPS.
  # Use https://<raspberry-pi-ip>:5443 and accept the self-signed certificate.
  port: 5443
  https: true
  certfile: null
  keyfile: null
  secret_key: "change-me-local-dev"

assistant:
  name: "Orion"
  language: "en"
  max_history_turns: 4
  visible_rationale: false
  system_prompt: |
    You are Orion, a local voice-first AI companion running on a Raspberry Pi.
    Speak English only.

    Be a smart, natural conversational partner: helpful, calm, concise, and context-aware.
    Keep spoken answers very short: usually 1-2 sentences.
    Use natural punctuation. Put a period after each sentence.
    The user transcript comes from speech recognition and may contain errors. If the text is too short,
    garbled, or ambiguous, ask a brief clarification instead of pretending you understood.

    The robot may provide camera observations, robot tool results, and logs. Treat them as sensor/tool context.

stt:
  engine: "vosk"
  sample_rate: 16000
  # Quality default: better English model than the tiny 40 MB one, still feasible on Raspberry Pi 5.
  # For maximum speed, switch to models/vosk/vosk-model-small-en-us-0.15 and run download_models.py --stt small.
  model_path: "models/vosk/vosk-model-en-us-0.22-lgraph"
  min_final_chars: 2
  min_final_words: 1
  reject_phrases:
    - "um"
    - "uh"
    - "hmm"
    - "mm"
    - "noise"

llm:
  engine: "llama_cpp"
  model_path: "models/llm/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  chat_format: "chatml"

  # Менший контекст = менше RAM і швидший prompt prefill.
  n_ctx: 1024

  # 3 потоки замість 4: трохи повільніше за absolute max,
  # але Raspberry Pi залишається живішою для camera, TTS, web UI.
  n_threads: 3
  n_batch: 128
  n_gpu_layers: 0

  temperature: 0.25
  top_p: 0.85
  repeat_penalty: 1.05

  # Дуже важливо для голосового робота.
  # Довгі відповіді звучать круто в чаті, але в роботі створюють latency.
  max_tokens: 90

  stop:
    - "<|im_end|>"

# Optional automatic clarification for very suspicious STT output.
quality_guard:
  enabled: true
  min_words_for_direct_answer: 2
  ask_clarification_for_single_word: true

tts:
  engine: "piper"
  piper_bin: "piper"

  model_path: "models/piper/en_US-lessac-medium.onnx"
  config_path: "models/piper/en_US-lessac-medium.onnx.json"

  speaker_id: null

  # Більше значення = повільніше і природніше.
  length_scale: 1.12

  # Трохи стабільніша, менш "нервова" інтонація.
  noise_scale: 0.45
  noise_w: 0.55

  # Було 0.08 — майже без пауз.
  sentence_silence: 0.28

  normalize_text: true

  # Менші chunks = швидше починає говорити.
  sentence_min_chars: 28
  sentence_max_chars: 180
  coalesce_wait_s: 0.08
  chunk_max_chars: 220

  # Це ми додамо у frontend нижче.
  playback_gap_ms: 120

  join_timeout_s: 90

logging:
  jsonl_path: "logs/voicepi.jsonl"
  console: true

memory:
  enabled: true
  db_path: "logs/memory.sqlite"
  user_id: "default"
  attach_to_prompt: true

  max_facts: 5
  recall_k: 2

  extract_facts: true
  max_episodes: 2000

  embeddings:
    enabled: false
    model_path: "models/embed/nomic-embed-text-v1.5.Q4_K_M.gguf"
    n_ctx: 512
    n_threads: 3

  summary:
    enabled: true
    trigger_turns: 10
    keep_recent_turns: 4
    max_tokens: 120

camera:
  # Uses Picamera2 and serves /camera/stream.mjpg plus /camera/snapshot.jpg.
  enabled: true
  width: 640
  height: 480

vision:
  enabled: true

  # Менше background CPU.
  poll_interval_s: 4.0

  # Не аналізувати кадр на кожен звичайний turn.
  # Vision все одно працюватиме:
  # - через кнопку Analyze current frame
  # - коли питання схоже на "what do you see?"
  snapshot_on_turn: true
  always_attach_to_prompt: false
  max_prompt_age_s: 8.0

  log_poll_observations: false
  obstacle_area_ratio: 0.10

  motion:
    enabled: true
    threshold: 24
    min_area_ratio: 0.01

  object_detection:
    enabled: true
    model_path: "models/vision/mobilenet_iter_73000.caffemodel"
    config_path: "models/vision/deploy.prototxt"
    confidence_threshold: 0.45
    max_objects: 6

client:
  vad_threshold: 0.018
  # Higher threshold while the assistant is speaking to avoid cancelling itself from speaker echo.
  barge_in_threshold: 0.045
  vad_hold_ms: 650
  min_speech_ms: 180
  preroll_ms: 450
  audio_chunk_ms: 80

robot:
  # Set true when the ESP32 firmware in esp32/voicepi_motor_controller.ino is running.
  enabled: false
  # Use the IP printed in the ESP32 Serial Monitor after it connects to Wi-Fi.
  base_url: "http://192.168.1.50"
  token: "change-me-robot-token"
  timeout_s: 2.0

  # Safety clamps. The LLM may request a movement, but these hard limits win.
  min_confidence: 0.55
  min_speed: 0.20
  max_speed: 0.75
  default_speed: 0.45
  min_duration_ms: 150
  max_duration_ms: 1800
  default_duration_ms: 700
  planner_max_tokens: 80
  # Speeds up normal chat: only run the LLM robot planner when the transcript looks robot-control-related.
  # This gate never executes commands by itself; it only decides whether to ask the planner.
  fast_intent_gate: true

  # Emergency behavior.
  stop_on_barge_in: true
  stop_on_disconnect: true

system:
  # Raspberry Pi health telemetry shown on the dashboard (CPU temp, CPU load, RAM).
  enabled: true
  # How often the background sampler refreshes (seconds). The dashboard polls /system/stats.
  interval_s: 2.0
  # Thresholds for highlighting. The Pi 5 starts soft-throttling around 80-85 C.
  temp_warn_c: 70.0
  temp_critical_c: 80.0
  cpu_warn_pct: 80.0
  cpu_critical_pct: 92.0
  ram_warn_pct: 80.0
  ram_critical_pct: 92.0