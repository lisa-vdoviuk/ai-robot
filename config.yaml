server:
  host: "0.0.0.0"
  # Browser microphone access from another device usually requires HTTPS.
  # Use https://<raspberry-pi-ip>:5443 and accept the self-signed certificate.
  port: 5443
  https: true
  certfile: null
  keyfile: null
  secret_key: "change-me-local-dev"

assistant:
  name: "Orion"
  language: "en"
  max_history_turns: 3
  visible_rationale: false
  system_prompt: |
    You are Orion, a local voice-first AI companion running on a Raspberry Pi.
    Speak English only.

    Keep answers short and natural: usually 1 sentence, maximum 2 sentences.
    Use simple wording and clear punctuation.
    The user transcript comes from speech recognition and may contain errors.
    If the transcript is unclear, ask one short clarification.

    The robot may provide camera observations, robot tool results, and logs.
    Treat them as sensor/tool context.

stt:
  engine: "vosk"
  sample_rate: 16000
  model_path: "models/vosk/vosk-model-en-us-0.22-lgraph"
  min_final_chars: 2
  min_final_words: 1
  reject_phrases:
    - "um"
    - "uh"
    - "hmm"
    - "mm"
    - "noise"

llm:
  engine: "groq"

  groq:
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    model: "llama-3.1-8b-instant"
    timeout_s: 30

  temperature: 0.25
  top_p: 0.85
  max_tokens: 70

tts:
  # "edge"   -- Microsoft Edge neural TTS (best quality, free, internet required, no model files)
  # "kokoro" -- Kokoro 82M via ONNX Runtime (excellent offline quality, ~400 MB models)
  # "piper"  -- Piper (fastest, lower quality)
  engine: "edge"

  normalize_text: true
  stream_during_generation: false

  sentence_min_chars: 60
  sentence_max_chars: 260
  chunk_max_chars: 320
  coalesce_wait_s: 0.05

  synth_timeout_s: 35
  join_timeout_s: 45
  playback_gap_ms: 120

  # --- Edge TTS config (engine: "edge") ---
  # Best quality voices: en-US-AriaNeural, en-US-JennyNeural, en-US-GuyNeural,
  #   en-GB-SoniaNeural, en-GB-RyanNeural, en-AU-NatashaNeural
  edge:
    voice: "en-US-AriaNeural"
    rate: "+0%"       # e.g. "+10%" to speak faster
    volume: "+0%"

  # --- Kokoro ONNX config (engine: "kokoro") ---
  # Voices: af_heart (default), af_bella, af_nicole, am_adam, am_michael,
  #   bf_emma, bf_isabella, bm_george, bm_lewis
  # Download models first: python scripts/download_models.py --tts-engine kokoro
  kokoro:
    voice: "af_heart"
    speed: 1.0
    lang: "en-us"   # "en-us" or "en-gb"
    sample_rate: 24000
    model_path: "models/kokoro/kokoro-v1.0.int8.onnx"
    voices_path: "models/kokoro/voices-v1.0.bin"

  # --- Piper config (engine: "piper") ---
  piper_bin: "piper"
  model_path: "models/piper/en_US-amy-medium.onnx"
  config_path: "models/piper/en_US-amy-medium.onnx.json"
  speaker_id: null
  length_scale: 1.12
  noise_scale: 0.45
  noise_w: 0.55
  sentence_silence: 0.28

memory:
  enabled: true
  db_path: "logs/memory.sqlite"
  user_id: "default"
  attach_to_prompt: true

  max_facts: 5
  recall_k: 2

  extract_facts: true
  max_episodes: 2000

  embeddings:
    enabled: false
    model_path: "models/embed/nomic-embed-text-v1.5.Q4_K_M.gguf"
    n_ctx: 512
    n_threads: 3

  summary:
    enabled: true
    trigger_turns: 10
    keep_recent_turns: 4
    max_tokens: 120

camera:
  enabled: true
  width: 320
  height: 240
  # For USB camera fallback: device index (0 = /dev/video0, 1 = /dev/video1, ...)
  cv2_device_index: 0

vision:
  enabled: true
  poll_enabled: false
  poll_interval_s: 8.0

  snapshot_on_turn: true
  always_attach_to_prompt: false
  max_prompt_age_s: 8.0

  log_poll_observations: false
  obstacle_area_ratio: 0.10

  motion:
    enabled: true
    threshold: 24
    min_area_ratio: 0.01

  object_detection:
    enabled: true
    # "yolo"   -- YOLOv11n via ONNX Runtime (no PyTorch). Best accuracy on COCO 80 classes.
    #            Download: python scripts/download_models.py --vision yolo
    # "mobilenet" -- OpenCV DNN MobileNet SSD. Lighter, 20 VOC classes.
    #            Download: python scripts/download_models.py --vision mobilenet-ssd
    backend: "yolo"

    # YOLOv11n ONNX model path (backend: yolo).
    # The app also checks <project_root>/yolo11n.onnx as fallback automatically.
    model_path: "models/vision/yolo11n.onnx"

    # MobileNet SSD paths (backend: mobilenet -- legacy)
    config_path: "models/vision/deploy.prototxt"

    imgsz: 416          # inference size in pixels (416 is fast on Pi; use 640 for accuracy)
    confidence_threshold: 0.35
    nms_threshold: 0.45
    max_objects: 8

client:
  vad_threshold: 0.018
  barge_in_threshold: 0.045
  vad_hold_ms: 650
  min_speech_ms: 180
  preroll_ms: 450
  audio_chunk_ms: 80

robot:
  enabled: false
  base_url: "http://192.168.1.50"
  token: "change-me-robot-token"
  timeout_s: 2.0

  min_confidence: 0.55
  min_speed: 0.20
  max_speed: 0.75
  default_speed: 0.45
  min_duration_ms: 150
  max_duration_ms: 1800
  default_duration_ms: 700
  planner_max_tokens: 80
  fast_intent_gate: true

  stop_on_barge_in: true
  stop_on_disconnect: true

system:
  enabled: true
  interval_s: 2.0
  temp_warn_c: 70.0
  temp_critical_c: 80.0
  cpu_warn_pct: 80.0
  cpu_critical_pct: 92.0
  ram_warn_pct: 80.0
  ram_critical_pct: 92.0